<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Vinland Barba</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="caixa">
            <h1><a href="index.html"><img src="frente barbearia.jfif" alt="Vinland Barba"></a></h1>
            <nav>
                <ul>
                    <li><a href="index.html">INÍCIO</a></li>
                    <li><a href="servicos.html">SERVIÇOS</a></li>
                    <li><a href="Contato.html" class="ativo">CONTATOS</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <h2 class="titulo">Fale com a gente</h2>
        <form>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome">

            <label for="email">Email</label>
            <input type="email" id="email">

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone">

            <fieldset class="opcoes">
                <p>Como prefere o nosso contato?</p>
                <label for="radio-email">
                    <input type="radio" name="contato" value="email" id="radio-email">
                    Email
                </label>
                <label for="radio-telefone">
                    <input type="radio" name="contato" value="telefone" id="radio-telefone">
                    Telefone
                </label>
                <label for="radio-whatsapp">
                    <input type="radio" name="contato" value="whatsapp" id="radio-whatsapp">
                    WhatsApp
                </label>
            </fieldset>

            <input type="submit" value="Enviar formulário">
        </form>
    </main>
    <footer>
        <img src="frente barbearia.jfif" alt="Vinland Barba">
        <p>&copy; Nicolas Seolim - 2026</p>
    </footer>
</body>
</html>
